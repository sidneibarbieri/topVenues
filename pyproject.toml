[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topvenues"
version = "1.13.0"
description = "Local, reproducible corpus tool for cybersecurity literature reviews"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Sidnei Barbieri"},
    {name = "Agney Lopes Roth Ferraz"},
    {name = "Lourenco Alves Pereira Junior"},
]
keywords = ["security", "bibliography", "research", "dblp", "abstracts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "altair>=5.0.0",
    "streamlit>=1.35.0",
    "watchdog>=4.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.urls]
Homepage = "https://sidneibarbieri.github.io/topVenues/"
Repository = "https://github.com/sidneibarbieri/topVenues"
Issues = "https://github.com/sidneibarbieri/topVenues/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.6.0",
]

[project.scripts]
topvenues = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.extractors", "web"]

[tool.setuptools.package-data]
web = ["styles.css", "static/*", "locales/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"web/app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
