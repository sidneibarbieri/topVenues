<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TopVenues — seven-minute demonstration</title>
    <style>
      body { margin: 0; background: #10233F; color: #F4F7FB; font: 16px system-ui, sans-serif; }
      main { max-width: 1280px; margin: 0 auto; padding: 2rem; }
      video { width: 100%; border: 1px solid #2867B2; border-radius: 8px; background: #0B1627; }
      a { color: #4DA3FF; }
    </style>
  </head>
  <body>
    <main>
      <h1>TopVenues: seven-minute research workflow</h1>
      <video controls preload="metadata"
        poster="../assets/demos/posters/topvenues-demo-v1.12.0.jpg">
        <source src="https://huggingface.co/datasets/sidneibarbieri/topvenues/resolve/main/assets/demo/topvenues-demo-v1.12.0.mp4" type="video/mp4">
        <track kind="captions" srclang="pt-BR" label="Português (Brasil)" default
          src="../assets/demos/captions/topvenues-demo-v1.12.0.pt-BR.vtt">
        <track kind="captions" srclang="en" label="English"
          src="../assets/demos/captions/topvenues-demo-v1.12.0.en.vtt">
      </video>
      <p>US-English narration. Brazilian Portuguese captions are selected by default.</p>
    </main>
  </body>
</html>
